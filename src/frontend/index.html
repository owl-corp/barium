<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModMail Log Viewer</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="discord-dark">
  <div class="app-layout">
    <header class="app-header">
      <div class="header-content">
        <div class="logo-area">
          <svg class="discord-icon" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <div>
            <h1>ModMail Log Archive</h1>
            <p class="subtitle">WASM-powered in-browser SQLite search</p>
          </div>
        </div>
        <div id="db-status" class="db-status loading">
          <span class="status-indicator"></span>
          <span id="status-text">Loading SQLite WASM...</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="search-section">
        <form id="search-form" class="search-bar">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input
              type="text"
              id="search-input"
              placeholder="Search by Discord User ID or Username (e.g. 165023948638126080)..."
              autocomplete="off"
              autofocus
            />
            <button type="button" id="clear-btn" class="clear-btn hidden">&times;</button>
          </div>
          <button type="submit" id="search-btn" class="primary-btn" disabled>Search</button>
        </form>

        <div class="quick-stats" id="stats-banner">
          <span id="stat-total-threads">--</span> threads indexed
        </div>
      </section>

      <section class="results-section">
        <div id="results-header" class="results-header hidden">
          <h2 id="results-count">Results</h2>
          <div class="sort-selector">
            <label for="sort-order">Sort:</label>
            <select id="sort-order">
              <option value="DESC">Newest First</option>
              <option value="ASC">Oldest First</option>
            </select>
          </div>
        </div>

        <div id="results-container" class="results-list">
          <div class="empty-state" id="empty-state">
            <p>Enter a User ID or Username above to query threads.</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
