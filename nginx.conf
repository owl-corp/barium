server {
    listen 8000;
    root /usr/share/nginx/html;

    # Private logs: keep them out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/wasm application/octet-stream application/vnd.sqlite3;
    gzip_min_length 1024;

    # /logs/<key> -> logs/<key>.html (the legacy modmail URLs)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
